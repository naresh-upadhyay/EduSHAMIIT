# EduSHAMIIT Nginx Reverse Proxy
# ================================
# Unified Gateway for EduSHAMIIT (Local Dev & Production Cloud VM)
# ================================

upstream edushamiit_api {
    server api:8000;
}

upstream supabase_kong {
    server supabase-kong:8000;
}

upstream livekit_server {
    server livekit:7882;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m    rate=500r/m;
limit_req_zone $binary_remote_addr zone=chat:10m   rate=50r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=20r/m;

# 1. HTTP Gateway (Port 80 - Handles HTTP requests for Local Dev & Server)
server {
    listen 80 default_server;
    server_name eduapi.shamiit.com localhost 127.0.0.1 _;

    client_max_body_size 50M;

    # Certbot HTTP-01 challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Supabase Routing ---
    location /auth/v1/ {
        proxy_pass http://supabase_kong;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/v1/ {
        proxy_pass http://supabase_kong;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/v1/ {
        proxy_pass http://supabase_kong;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase Realtime WebSocket
    location /realtime/v1/ {
        proxy_pass http://supabase_kong;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- LiveKit Signaling Routing ---
    location /rtc {
        proxy_pass http://livekit_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- FastAPI Routing ---
    location /health {
        proxy_pass         http://edushamiit_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Origin            $http_origin;
        access_log off;
    }

    location / {
        limit_req zone=api burst=100 nodelay;
        proxy_pass         http://edushamiit_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Origin            $http_origin;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 60s;
    }

    location /api/chat/message {
        limit_req zone=chat burst=10 nodelay;
        proxy_pass             http://edushamiit_api;
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     300s;
        proxy_set_header       Connection '';
        proxy_http_version     1.1;
        chunked_transfer_encoding off;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       Origin            $http_origin;
    }

    location /api/chat/voice {
        limit_req zone=chat burst=5 nodelay;
        client_max_body_size 25M;
        proxy_pass           http://edushamiit_api;
        proxy_read_timeout   120s;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     Origin $http_origin;
    }

    location /api/chat/image {
        limit_req zone=upload burst=5 nodelay;
        client_max_body_size 15M;
        proxy_pass           http://edushamiit_api;
        proxy_read_timeout   60s;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     Origin $http_origin;
    }

    location /api/rag/ingest {
        limit_req zone=upload burst=3 nodelay;
        client_max_body_size 50M;
        proxy_pass           http://edushamiit_api;
        proxy_read_timeout   300s;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     Origin $http_origin;
    }

    location /api/iot/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass           http://edushamiit_api;
        proxy_read_timeout   10s;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
        proxy_set_header     Origin $http_origin;
    }

    location /api/ws/ {
        proxy_pass             http://edushamiit_api;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       Origin     $http_origin;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }
}

# 2. HTTPS Gateway (Port 443 SSL - Production Cloud VM)
server {
    listen 443 ssl;
    server_name eduapi.shamiit.com;

    ssl_certificate /etc/letsencrypt/live/eduapi.shamiit.com/fullchain.pem;
