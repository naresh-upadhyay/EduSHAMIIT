# EduSHAMIIT Nginx Load Balancer
# ================================
# Distributes traffic across 3 FastAPI replica instances

upstream edushamiit_api {
    least_conn;
    server api-1:8000;
    server api-2:8000;
    server api-3:8000;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m    rate=500r/m;
limit_req_zone $binary_remote_addr zone=chat:10m   rate=50r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=20r/m;

server {
    listen 80;
    server_name _;

    # Health check endpoint (no rate limit)
    location /health {
        proxy_pass         http://edushamiit_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Standard API endpoints
    location / {
        limit_req zone=api burst=100 nodelay;
        proxy_pass         http://edushamiit_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 60s;
    }

    # AI Chat SSE endpoints (long-lived connections)
    location /api/chat/message {
        limit_req zone=chat burst=10 nodelay;
        proxy_pass             http://edushamiit_api;
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     300s;
        proxy_set_header       Connection '';
        proxy_http_version     1.1;
        chunked_transfer_encoding off;
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Voice upload endpoint
    location /api/chat/voice {
        limit_req zone=chat burst=5 nodelay;
        client_max_body_size 25M;
        proxy_pass           http://edushamiit_api;
        proxy_read_timeout   120s;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
    }

    # Image upload endpoint
    location /api/chat/image {
        limit_req zone=upload burst=5 nodelay;
        client_max_body_size 15M;
        proxy_pass           http://edushamiit_api;
        proxy_read_timeout   60s;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
    }

    # RAG document ingestion (large files)
    location /api/rag/ingest {
        limit_req zone=upload burst=3 nodelay;
        client_max_body_size 50M;
        proxy_pass           http://edushamiit_api;
        proxy_read_timeout   300s;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
    }

    # IoT control (low latency, high burst)
    location /api/iot/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass           http://edushamiit_api;
        proxy_read_timeout   10s;
        proxy_set_header     Host $host;
        proxy_set_header     X-Real-IP $remote_addr;
    }

    # WebSocket upgrade support
    location /api/ws/ {
        proxy_pass             http://edushamiit_api;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }
}
