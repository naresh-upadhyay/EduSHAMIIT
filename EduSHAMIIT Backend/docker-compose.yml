version: '3.8'

services:
  # ============================================
  # INFRASTRUCTURE (Always starts locally)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: edushamiit-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - edushamiit-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: edushamiit-rabbitmq
    ports:
      - "5672:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: eduSHAMIIT
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-eduSHAMIIT2026}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - edushamiit-net
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: edushamiit-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      - edushamiit-net
    restart: unless-stopped

  # ============================================
  # BACKEND APIS (Always starts locally)
  # ============================================
  api-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edushamiit-api-1
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-eduSHAMIIT2026}@${DB_HOST:-host.docker.internal}:${DB_PORT:-54322}/postgres
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://eduSHAMIIT:${RABBITMQ_PASSWORD:-eduSHAMIIT2026}@rabbitmq:5672
      - SUPABASE_URL=http://${KONG_HOST:-host.docker.internal}:${KONG_PORT:-54321}
      - SUPABASE_JWT_SECRET=${JWT_SECRET:-eduSHAMIIT-jwt-secret-2026}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - rabbitmq
    networks:
      - edushamiit-net
    restart: unless-stopped

  api-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edushamiit-api-2
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-eduSHAMIIT2026}@${DB_HOST:-host.docker.internal}:${DB_PORT:-54322}/postgres
      - REDIS_URL=redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    networks:
      - edushamiit-net
    restart: unless-stopped

  api-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edushamiit-api-3
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-eduSHAMIIT2026}@${DB_HOST:-host.docker.internal}:${DB_PORT:-54322}/postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - edushamiit-net
    restart: unless-stopped

  # ============================================
  # SUPABASE STACK (Only starts in 'supabase' profile, e.g. for PROD)
  # ============================================
  db:
    profiles: ["supabase"]
    image: public.ecr.aws/supabase/postgres:17.6.1.095
    container_name: edushamiit-db
    ports:
      - "${DB_PORT:-54322}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduSHAMIIT2026}
      POSTGRES_DB: postgres
    volumes:
      - supabase_db_EduSHAMIIT_Master:/var/lib/postgresql/data
    networks:
      - edushamiit-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 3

  auth:
    profiles: ["supabase"]
    image: public.ecr.aws/supabase/gotrue:v2.187.0
    container_name: edushamiit-auth
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-eduSHAMIIT2026}@db:5432/postgres?sslmode=disable
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-eduSHAMIIT-jwt-secret-2026}
    networks:
      - edushamiit-net
    restart: unless-stopped

  rest:
    profiles: ["supabase"]
    image: public.ecr.aws/supabase/postgrest:v14.5
    container_name: edushamiit-rest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-eduSHAMIIT2026}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_JWT_SECRET: ${JWT_SECRET:-eduSHAMIIT-jwt-secret-2026}
    networks:
      - edushamiit-net
    restart: unless-stopped

  kong:
    profiles: ["supabase"]
    image: kong:2.8.1
    container_name: edushamiit-kong
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
    ports:
      - "${KONG_PORT:-54321}:8000"
    networks:
      - edushamiit-net
    restart: unless-stopped

  studio:
    profiles: ["supabase"]
    image: public.ecr.aws/supabase/studio:2026.03.04-sha-0043607
    container_name: edushamiit-studio
    ports:
      - "${STUDIO_PORT:-54323}:3000"
    environment:
      SUPABASE_URL: http://kong:8000
    networks:
      - edushamiit-net
    restart: unless-stopped

volumes:
  supabase_db_EduSHAMIIT_Master:
    external: true
  redis_data:
  rabbitmq_data:

networks:
  edushamiit-net:
    driver: bridge