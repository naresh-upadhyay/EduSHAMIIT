version: '3.8'

services:
  # PostgreSQL 15 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15
    container_name: edushamiit-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edushamiit}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_2026}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - edushamiit-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 for caching
  redis:
    image: redis:7-alpine
    container_name: edushamiit-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password_2026}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - edushamiit-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ for job queue
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: edushamiit-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - edushamiit-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  edushamiit-network:
    driver: bridge