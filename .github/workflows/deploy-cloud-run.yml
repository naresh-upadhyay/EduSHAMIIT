name: Deploy to Google Cloud Run

on:
  push:
    branches: [main, deploy]
    paths:
      - ".github/workflows/**"
      - "EduSHAMIIT Backend/backend/**"
      - "Dockerfile"
      - "requirements.txt"
  pull_request:
    branches: [main, deploy]
    paths:
      - "EduSHAMIIT Backend/backend/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE_NAME || 'edushamiit-api' }}
  REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'edushamiit-api-repo' }}

jobs:
  # ─────────────────────────────────────────────────────────
  # TEST & LINT
  # ─────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EduSHAMIIT Backend/backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "EduSHAMIIT Backend/backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run syntax check
        run: python -m py_compile app/main.py

      - name: Check for unused imports (flake8)
        run: |
          pip install flake8
          flake8 app/ --count --select=F401 --statistics --exit-zero

  # ─────────────────────────────────────────────────────────
  # BUILD & PUSH TO ARTIFACT REGISTRY (always works)
  # ─────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to Artifact Registry
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Docker Auth (Artifact Registry)
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and Push (Artifact Registry)
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE_NAME}:${{ github.sha }}"
          IMAGE_LATEST="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE_NAME}:latest"

          docker build \
            -t "${IMAGE}" \
            -t "${IMAGE_LATEST}" \
            -f EduSHAMIIT\ Backend/backend/Dockerfile \
            EduSHAMIIT\ Backend/backend

          docker push "${IMAGE}"
          docker push "${IMAGE_LATEST}"

          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: Run Database Migrations
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ DATABASE_URL secret is not set! Skipping migrations..."
            exit 0
          fi
          
          echo "✅ DATABASE_URL is set. Installing postgresql-client..."
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client 2>&1
          
          # Test connection first
          echo "Testing database connection..."
          psql "$DATABASE_URL" -c "SELECT 1;" 2>&1 || { echo "⚠️ Cannot connect to database. Skipping migrations."; exit 0; }
          
          # All future connections already work past this point
          echo "Proceeding with migrations..."
          
          # 1. Ensure schema_migrations table exists
          echo "Checking migration tracking table..."
          psql "$DATABASE_URL" -c "CREATE TABLE IF NOT EXISTS public.schema_migrations (version VARCHAR(255) PRIMARY KEY, applied_at TIMESTAMP WITH TIME ZONE DEFAULT NOW());" 2>&1
          
          # 2. Get list of already applied migrations
          APPLIED_MIGRATIONS=$(psql "$DATABASE_URL" -t -A -c "SELECT version FROM public.schema_migrations;" 2>&1)
          
          # 3. Run any new migrations
          echo "Scanning for new migrations..."
          ls -1 "EduSHAMIIT Database/edushamiit-db/migrations"/*.sql 2>/dev/null | sort -V | while read -r file; do
            FILENAME=$(basename "$file")
            
            if echo "$APPLIED_MIGRATIONS" | grep -qxF "$FILENAME"; then
              echo "✅ Skipping $FILENAME (already applied)"
            else
              echo "Applying new migration: $FILENAME..."
              psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f "$file" 2>&1
              if [ $? -ne 0 ]; then
                echo "⚠️ Migration failed at $file (non-fatal)"
              else
                psql "$DATABASE_URL" -c "INSERT INTO public.schema_migrations (version) VALUES ('$FILENAME');" 2>&1
              fi
            fi
          done
          
          echo "✅ Database migrations step complete!"

      - name: Deploy to Cloud Run
        run: |
          # Build list of env vars to update
          ENV_VARS="ENVIRONMENT=production,DEBUG=false,APP_ENV=production,JWT_ALGORITHM=HS256"
          
          if [ ! -z "${{ secrets.DATABASE_URL }}" ]; then
            ENV_VARS="${ENV_VARS},DATABASE_URL=${{ secrets.DATABASE_URL }}"
          fi
          if [ ! -z "${{ secrets.SUPABASE_URL }}" ]; then
            ENV_VARS="${ENV_VARS},SUPABASE_URL=${{ secrets.SUPABASE_URL }}"
          fi
          if [ ! -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            ENV_VARS="${ENV_VARS},SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}"
          fi
          if [ ! -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            ENV_VARS="${ENV_VARS},SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          fi
          if [ ! -z "${{ secrets.SUPABASE_JWT_SECRET }}" ]; then
            ENV_VARS="${ENV_VARS},SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}"
          fi
          if [ ! -z "${{ secrets.REDIS_URL }}" ]; then
            ENV_VARS="${ENV_VARS},REDIS_URL=${{ secrets.REDIS_URL }}"
          fi
          
          gcloud run deploy ${SERVICE_NAME} \
            --image "${{ env.IMAGE }}" \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --port 8000 \
            --memory 1Gi \
            --cpu 1 \
            --max-instances 3 \
            --concurrency 80 \
            --timeout 300 \
            --update-env-vars "${ENV_VARS}"

  # ─────────────────────────────────────────────────────────
  # DEPLOY TO DOCKER HUB (optional — won't block anything)
  # ─────────────────────────────────────────────────────────
  push-to-docker-hub:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        id: docker_login
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push to Docker Hub
        if: steps.docker_login.outcome == 'success'
        run: |
          DH_IMAGE="${{ secrets.DOCKER_USERNAME || 'nehanareshupadhyay' }}/erpshamiit"

          # Build using docker compose to respect the docker-compose configuration
          DOCKER_IMAGE="${DH_IMAGE}:latest" docker compose build api

          # Tag with git commit SHA and ref name
          docker tag "${DH_IMAGE}:latest" "${DH_IMAGE}:${{ github.sha }}"
          docker tag "${DH_IMAGE}:latest" "${DH_IMAGE}:${{ github.ref_name }}"

          # Push tags
          docker push "${DH_IMAGE}:latest"
          docker push "${DH_IMAGE}:${{ github.sha }}"
          docker push "${DH_IMAGE}:${{ github.ref_name }}"

  # ─────────────────────────────────────────────────────────
  # DEPLOYMENT VERIFICATION
  # ─────────────────────────────────────────────────────────
  verify-deploy:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: success()
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Check Cloud Run revision is serving traffic
        run: |
          echo "Checking Cloud Run deployment status..."
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          
          TRAFFIC=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.traffic[0].revisionName)")
          
          if [ -z "$TRAFFIC" ]; then
            echo "❌ No revision serving traffic — deployment may have failed!"
            gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format="json"
            exit 1
          fi
          
          echo "✅ Service: $SERVICE_URL"
          echo "✅ Revision serving 100% traffic: $TRAFFIC"
          echo "✅ Deployment successful!"