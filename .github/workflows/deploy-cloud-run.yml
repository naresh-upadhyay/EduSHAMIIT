name: Deploy to Google Cloud Run

on:
  push:
    branches: [main, deploy]
    paths:
      - ".github/workflows/**"
      - "EduSHAMIIT Backend/backend/**"
      - "Dockerfile"
      - "requirements.txt"
  pull_request:
    branches: [main, deploy]
    paths:
      - "EduSHAMIIT Backend/backend/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE_NAME || 'edushamiit-api' }}
  REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'edushamiit-api-repo' }}

jobs:
  # ─────────────────────────────────────────────────────────
  # TEST & LINT
  # ─────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EduSHAMIIT Backend/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "EduSHAMIIT Backend/backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run syntax check
        run: python -m py_compile app/main.py

      - name: Check for unused imports (flake8)
        run: |
          pip install flake8
          flake8 app/ --count --select=F401 --statistics --exit-zero

  # ─────────────────────────────────────────────────────────
  # BUILD & PUSH TO ARTIFACT REGISTRY (always works)
  # ─────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to Artifact Registry
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker Auth (Artifact Registry)
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and Push (Artifact Registry)
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE_NAME}:${{ github.sha }}"
          IMAGE_LATEST="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE_NAME}:latest"

          docker build \
            -t "${IMAGE}" \
            -t "${IMAGE_LATEST}" \
            -f EduSHAMIIT\ Backend/backend/Dockerfile \
            EduSHAMIIT\ Backend/backend

          docker push "${IMAGE}"
          docker push "${IMAGE_LATEST}"

          echo "IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: Deploy to Cloud Run via YAML
        run: |
          cat > cloudrun.yaml << 'EOF'
          apiVersion: serving.knative.dev/v1
          kind: Service
          metadata:
            name: ${SERVICE_NAME}
          spec:
            template:
              metadata:
                annotations:
                  autoscaling.knative.dev/maxScale: "3"
              spec:
                containerConcurrency: 80
                timeoutSeconds: 300
                containers:
                - image: "${IMAGE}"
                  ports:
                  - containerPort: 8000
                    name: http1
                  resources:
                    limits:
                      cpu: "1"
                      memory: 1Gi
                  env:
                  - name: SUPABASE_URL
                    value: "${{ secrets.SUPABASE_URL }}"
                  - name: SUPABASE_ANON_KEY
                    value: "${{ secrets.SUPABASE_ANON_KEY }}"
                  - name: SUPABASE_SERVICE_ROLE_KEY
                    value: "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
                  - name: SUPABASE_JWT_SECRET
                    value: "${{ secrets.SUPABASE_JWT_SECRET }}"
                  - name: ENVIRONMENT
                    value: production
                  - name: DEBUG
                    value: "false"
                  - name: APP_ENV
                    value: production
                  - name: JWT_ALGORITHM
                    value: HS256
                  - name: REDIS_URL
                    value: "${{ secrets.REDIS_URL }}"
                  - name: DATABASE_URL
                    value: "${{ secrets.DATABASE_URL }}"
                  startupProbe:
                    tcpSocket:
                      port: 8000
                    initialDelaySeconds: 5
                    timeoutSeconds: 240
                    periodSeconds: 240
                    failureThreshold: 1
          EOF
          gcloud run services replace cloudrun.yaml --region=${REGION}

  # ─────────────────────────────────────────────────────────
  # DEPLOY TO DOCKER HUB (optional — won't block anything)
  # ─────────────────────────────────────────────────────────
  push-to-docker-hub:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ secrets.DOCKER_USERNAME != '' }}
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push to Docker Hub
        run: |
          DH_IMAGE="${{ secrets.DOCKER_USERNAME }}/edushamiit-api"

          docker build \
            -t "${DH_IMAGE}:${{ github.sha }}" \
            -t "${DH_IMAGE}:latest" \
            -f EduSHAMIIT\ Backend/backend/Dockerfile \
            EduSHAMIIT\ Backend/backend

          docker push "${DH_IMAGE}:${{ github.sha }}"
          docker push "${DH_IMAGE}:latest"

  # ─────────────────────────────────────────────────────────
  # DEPLOYMENT VERIFICATION
  # ─────────────────────────────────────────────────────────
  verify-deploy:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: success()
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Check Cloud Run revision is serving traffic
        run: |
          echo "Checking Cloud Run deployment status..."
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          
          TRAFFIC=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.traffic[0].revisionName)")
          
          if [ -z "$TRAFFIC" ]; then
            echo "❌ No revision serving traffic — deployment may have failed!"
            gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format="json"
            exit 1
          fi
          
          echo "✅ Service: $SERVICE_URL"
          echo "✅ Revision serving 100% traffic: $TRAFFIC"
          echo "✅ Deployment successful!"