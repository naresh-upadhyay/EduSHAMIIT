name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'EduSHAMIIT Backend/backend/**'
      - 'cloudbuild.yaml'
      - 'infrastructure/terraform/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE_NAME || 'edushamiit-api' }}
  REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'edushamiit-api-repo' }}

jobs:
  # ─────────────────────────────────────────────────────────
  # TEST & LINT
  # ─────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EduSHAMIIT Backend/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'EduSHAMIIT Backend/backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run syntax check
        run: python -m py_compile app/main.py

      - name: Check for unused imports (flake8)
        run: |
          pip install flake8
          flake8 app/ --count --select=F401 --statistics --exit-zero

  # ─────────────────────────────────────────────────────────
  # BUILD & PUSH DOCKER IMAGE
  # ─────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker Auth (Artifact Registry)
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and Push
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE_NAME}:${{ github.sha }}"
          IMAGE_LATEST="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE_NAME}:latest"

          docker build \
            -t "${IMAGE}" \
            -t "${IMAGE_LATEST}" \
            -f EduSHAMIIT\ Backend/backend/Dockerfile \
            EduSHAMIIT\ Backend/backend

          docker push "${IMAGE}"
          docker push "${IMAGE_LATEST}"

      - name: Tag image for deploy
        run: |
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

  # ─────────────────────────────────────────────────────────
  # DEPLOY TO CLOUD RUN (WITH TERRAFORM)
  # ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.0'

      - name: Terraform Init
        working-directory: infrastructure/terraform
        run: terraform init

      - name: Terraform Apply (infrastructure)
        working-directory: infrastructure/terraform
        run: |
          terraform apply -auto-approve \
            -var="project_id=${PROJECT_ID}" \
            -var="region=${REGION}" \
            -var="service_name=${SERVICE_NAME}" \
            -var="image_tag=${{ github.sha }}" \
            -var="min_instances=0" \
            -var="max_instances=3" \
            -var="cpu=1" \
            -var="memory=512Mi"

  # ─────────────────────────────────────────────────────────
  # SMOKE TEST
  # ─────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy]
    if: success()

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Get Service URL
        id: get_url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format="value(status.url)")
          echo "SERVICE_URL=${URL}" >> $GITHUB_OUTPUT

      - name: Health Check
        run: |
          URL="${{ steps.get_url.outputs.SERVICE_URL }}"
          echo "Checking health at ${URL}/health"
          curl -f -s --retry 5 --retry-delay 10 --retry-all-errors \
            "${URL}/health" || exit 1

      - name: Smoke Test Success
        run: echo "✅ Deployment verified — service is healthy!"