name: Deploy Academic Web to GitHub Pages

on:
  push:
    branches: [main, master, deploy, monorepo]
    paths:
      - "edu_shamiit_academic/**"
      - "edu_shamiit_core/**"
      - ".github/workflows/deploy-academic-web.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Deploy Academic Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Disable analytics
        run: flutter config --no-analytics

      - name: Get core dependencies
        working-directory: edu_shamiit_core
        run: flutter pub get

      - name: Get academic dependencies
        working-directory: edu_shamiit_academic
        run: flutter pub get

      - name: Build Academic Flutter Web
        working-directory: edu_shamiit_academic
        run: |
          flutter build web --release --base-href=/
          cp build/web/index.html build/web/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: edu_shamiit_academic/build/web
          publish_branch: gh-pages
          cname: academic.shamiit.com
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: Academic Flutter web build ${{ github.sha }}"
