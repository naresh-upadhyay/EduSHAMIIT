name: Deploy Admin Web to GitHub Pages

on:
  push:
    branches: [main, master, deploy, monorepo, admin]
    paths:
      - "edu_shamiit_admin/**"
      - "edu_shamiit_core/**"
      - ".github/workflows/deploy-admin-web.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Deploy Admin Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Disable analytics
        run: flutter config --no-analytics

      - name: Get core dependencies
        working-directory: edu_shamiit_core
        run: flutter pub get

      - name: Get admin dependencies
        working-directory: edu_shamiit_admin
        run: flutter pub get

      - name: Build Admin Flutter Web
        working-directory: edu_shamiit_admin
        run: |
          flutter build web --release --base-href=/

      - name: Deploy to External Repository (EduSHAMIIT-Admin)
        env:
          TOKEN: ${{ secrets.ADMIN_DEPLOY_TOKEN }}
        run: |
          cd edu_shamiit_admin/build/web
          echo "eduadmin.shamiit.com" > CNAME
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: Admin Flutter web build ${{ github.sha }}"
          git branch -M gh-pages
          if [ -n "$TOKEN" ]; then
            echo "Publishing using ADMIN_DEPLOY_TOKEN..."
            git remote add origin "https://x-access-token:${TOKEN}@github.com/naresh-upadhyay/EduSHAMIIT-Admin.git"
          else
            echo "Publishing using GITHUB_TOKEN..."
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/naresh-upadhyay/EduSHAMIIT-Admin.git"
          fi
          git push -f origin gh-pages
