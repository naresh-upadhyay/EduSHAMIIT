name: Deploy LiveKit to Google Cloud Run

on:
  push:
    branches: [main, master, deploy, monorepo]
    paths:
      - ".github/workflows/deploy-livekit-cloud-run.yml"
      - "livekit/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  REPOSITORY: ${{ vars.ARTIFACT_REPOSITORY || 'edushamiit-api-repo' }}
  LIVEKIT_SERVICE: "livekit-server"
  EGRESS_SERVICE: "livekit-egress"

jobs:
  deploy-livekit:
    name: Build and Deploy LiveKit & Egress
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Docker Auth (Artifact Registry)
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and Push LiveKit Server Image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${LIVEKIT_SERVICE}:${{ github.sha }}"
          IMAGE_LATEST="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${LIVEKIT_SERVICE}:latest"

          docker build \
            -t "${IMAGE}" \
            -t "${IMAGE_LATEST}" \
            -f livekit/Dockerfile.livekit \
            livekit

          docker push "${IMAGE}"
          docker push "${IMAGE_LATEST}"

          echo "LIVEKIT_IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: Build and Push LiveKit Egress Image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${EGRESS_SERVICE}:${{ github.sha }}"
          IMAGE_LATEST="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${EGRESS_SERVICE}:latest"

          docker build \
            -t "${IMAGE}" \
            -t "${IMAGE_LATEST}" \
            -f livekit/Dockerfile.egress \
            livekit

          docker push "${IMAGE}"
          docker push "${IMAGE_LATEST}"

          echo "EGRESS_IMAGE=${IMAGE}" >> $GITHUB_ENV

      - name: Deploy LiveKit Server to Cloud Run
        run: |
          # Prepare environment variables
          ENV_VARS="ENVIRONMENT=production"
          if [ ! -z "${{ secrets.REDIS_URL }}" ]; then
            ENV_VARS="${ENV_VARS},REDIS_URL=${{ secrets.REDIS_URL }}"
          fi
          if [ ! -z "${{ secrets.LIVEKIT_API_KEY }}" ]; then
            ENV_VARS="${ENV_VARS},LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}"
          fi
          if [ ! -z "${{ secrets.LIVEKIT_API_SECRET }}" ]; then
            ENV_VARS="${ENV_VARS},LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}"
          fi

          # Deploying LiveKit Server
          gcloud run deploy ${LIVEKIT_SERVICE} \
            --image "${{ env.LIVEKIT_IMAGE }}" \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 2Gi \
            --cpu 2 \
            --max-instances 5 \
            --concurrency 100 \
            --timeout 600 \
            --update-env-vars "${ENV_VARS}"

      - name: Deploy LiveKit Egress to Cloud Run
        run: |
          # Fetch URL of deployed LiveKit Server to use for WS connection
          LIVEKIT_HTTP_URL=$(gcloud run services describe ${LIVEKIT_SERVICE} --region=${REGION} --format="value(status.url)")
          LIVEKIT_WS_URL=$(echo "${LIVEKIT_HTTP_URL}" | sed -e 's/^https:\/\//wss:\/\//' -e 's/^http:\/\//ws:\/\//')

          # Prepare environment variables
          ENV_VARS="ENVIRONMENT=production,LIVEKIT_WS_URL=${LIVEKIT_WS_URL}"
          if [ ! -z "${{ secrets.REDIS_URL }}" ]; then
            ENV_VARS="${ENV_VARS},REDIS_URL=${{ secrets.REDIS_URL }}"
          fi
          if [ ! -z "${{ secrets.LIVEKIT_API_KEY }}" ]; then
            ENV_VARS="${ENV_VARS},LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}"
          fi
          if [ ! -z "${{ secrets.LIVEKIT_API_SECRET }}" ]; then
            ENV_VARS="${ENV_VARS},LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}"
          fi
          
          # Add Storage configs
          if [ ! -z "${{ secrets.S3_BUCKET }}" ]; then
            ENV_VARS="${ENV_VARS},S3_BUCKET=${{ secrets.S3_BUCKET }}"
          fi
          if [ ! -z "${{ secrets.S3_ACCESS_KEY }}" ]; then
            ENV_VARS="${ENV_VARS},S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}"
          fi
          if [ ! -z "${{ secrets.S3_SECRET }}" ]; then
            ENV_VARS="${ENV_VARS},S3_SECRET=${{ secrets.S3_SECRET }}"
          fi
          if [ ! -z "${{ secrets.S3_REGION }}" ]; then
            ENV_VARS="${ENV_VARS},S3_REGION=${{ secrets.S3_REGION }}"
          fi
          if [ ! -z "${{ secrets.S3_ENDPOINT }}" ]; then
            ENV_VARS="${ENV_VARS},S3_ENDPOINT=${{ secrets.S3_ENDPOINT }}"
          fi

          # Deploying LiveKit Egress
          gcloud run deploy ${EGRESS_SERVICE} \
            --image "${{ env.EGRESS_IMAGE }}" \
            --region ${REGION} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 4Gi \
            --cpu 4 \
            --max-instances 3 \
            --concurrency 1 \
            --timeout 600 \
            --execution-environment gen2 \
            --update-env-vars "${ENV_VARS}"
