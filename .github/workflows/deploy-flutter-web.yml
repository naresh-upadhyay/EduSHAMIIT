name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [main, deploy]
    paths:
      - "edu_shamiit_ai/**"
      - ".github/workflows/deploy-flutter-web.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Using latest stable (currently 3.44.0+ with Dart 3.12+)
  # No version pin to avoid SDK version conflicts with dependencies
  FLUTTER_VERSION: ""

jobs:
  build-and-deploy:
    name: Build & Deploy Flutter Web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Disable analytics
        run: flutter config --no-analytics

      - name: Get dependencies
        working-directory: edu_shamiit_ai
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: edu_shamiit_ai
        run: |
          flutter build web --release --base-href=/EduSHAMIIT/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: edu_shamiit_ai/build/web
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: Flutter web build ${{ github.sha }}"