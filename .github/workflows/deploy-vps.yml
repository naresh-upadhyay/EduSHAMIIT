name: Deploy to Hostinger VPS

on:
  push:
    branches: [main, master, deploy, monorepo, admin]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Zip Repository
        run: |
          rm -f project.zip app.zip
          zip -q -r project.zip . -x "*.git*" "*.github*" "*.idea*" "*.vscode*" "*node_modules/*" "*/build/*" "build/*" "*/.dart_tool/*" ".dart_tool/*" "app.zip" "project.zip" "*.apk" "*.aab" "*.ipa" "*.tar.gz" "scratch/*"

      - name: Upload and Deploy
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} "mkdir -p /root/app"
          cat project.zip | ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} "cat > /root/app/project.zip"

          ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} '
            exec > /root/app/deploy.log 2>&1
            set -e
            set -x

            echo "=== [1/6] Extracting project files ==="
            cd /root/app
            rm -rf "EduSHAMIIT Database" "EduSHAMIIT Backend" "nginx"
            unzip -q -o project.zip
            rm -f project.zip

            echo "=== [2/6] Fixing file permissions and line endings ==="
            find /root/app -type f -name "*.sh" -exec chmod +x {} +
            find /root/app -type f \( -name "*.sh" -o -name "*.exs" -o -name "*.sql" -o -name "*.conf" -o -name "*.yml" -o -name "*.yaml" \) -exec sed -i "s/\r$//" {} +

            echo "=== [3/6] Setting SSL paths and restarting Docker containers ==="
            export NGINX_SSL_CERT_PATH=/home/user/conf/web/eduapi.shamiit.com/ssl/eduapi.shamiit.com.pem
            export NGINX_SSL_KEY_PATH=/home/user/conf/web/eduapi.shamiit.com/ssl/eduapi.shamiit.com.key
            docker compose down
            docker compose up -d --build

            echo "=== [4/6] Waiting for edushamiit-api container to be running ==="
            for i in $(seq 1 30); do
              if docker ps --format "{{.Names}}" | grep -q "^edushamiit-api$"; then
                echo "edushamiit-api container is running."
                break
              fi
              echo "Waiting for edushamiit-api to start (attempt $i/30)..."
              sleep 2
            done

            echo "=== [5/6] Syncing migration runner and migration scripts ==="
            docker cp /root/app/run_migrations.py edushamiit-api:/app/run_migrations.py
            docker exec edushamiit-api rm -rf "/app/EduSHAMIIT Database"
            docker cp "/root/app/EduSHAMIIT Database" edushamiit-api:/app/

            echo "=== [6/6] Executing database migrations ==="
            docker exec edushamiit-api pip install psycopg2-binary || true
            docker exec edushamiit-api python3 /app/run_migrations.py "postgresql://supabase_admin:eduSHAMIIT2026_pg@db:5432/postgres"

            echo "=== [SUCCESS] Deployment and migrations completed successfully! ==="
          ' || {
            ERR_MSG=$(ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} "tail -n 30 /root/app/deploy.log | tr '\n' ' '")
            echo "::error::VPS deployment failed: $ERR_MSG"
            ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} "tail -n 100 /root/app/deploy.log"
            exit 1
          }
