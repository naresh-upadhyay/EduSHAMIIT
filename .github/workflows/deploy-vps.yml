name: Deploy to Hostinger VPS

on:
  push:
    branches: [main, master, deploy, monorepo]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Zip Repository
        run: |
          zip -r project.zip . -x "*.git*" "*.github*" "*.idea*" "*.vscode*" "node_modules/*" "build/*" "project.zip"

      - name: Upload and Deploy
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} "mkdir -p /root/app"
          cat project.zip | ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} "cat > /root/app/project.zip"

          ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} '
            cd /root/app && \
            unzip -o project.zip && \
            rm project.zip && \
            find /root/app -type f -name "*.sh" -exec chmod +x {} + && \
            find /root/app -type f \( -name "*.sh" -o -name "*.exs" -o -name "*.sql" -o -name "*.conf" -o -name "*.yml" -o -name "*.yaml" \) -exec sed -i "s/\r$//" {} + && \
            docker compose down && \
            docker compose up -d --build && \
            docker cp /root/app/run_migrations.py edushamiit-api:/app/run_migrations.py && \
            docker cp "/root/app/EduSHAMIIT Database" edushamiit-api:/app/ && \
            docker exec edushamiit-api pip install psycopg2-binary && \
            docker exec edushamiit-api python3 /app/run_migrations.py "postgresql://postgres:eduSHAMIIT2026_pg@db:5432/postgres"
          '
