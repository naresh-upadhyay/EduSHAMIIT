name: edu_shamiit_core
description: Shared library for EduSHAMIIT application (models, services, constants, themes, widgets)
version: 0.0.1
publish_to: "none"

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.0.0

  # Backend & Auth
  supabase_flutter: ^2.3.2
  http: ^1.1.0
  http_parser: ^4.0.2
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.2

  # UI, Icons, Typography
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6
  font_awesome_flutter: ^11.0.0
  google_fonts: ^6.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.2
  url_launcher: ^6.2.4
  flutter_local_notifications: ^16.3.2
  timezone: ^0.9.2
  local_auth: ^2.1.8
  flutter_tts: ^4.2.5
  web_socket_channel: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
