function as(){const i=document.getElementById('ai'),m=i.value.trim();if(!m)return;i.value='';const b=document.getElementById('am');b.innerHTML+=`<div style="background:linear-gradient(135deg,#4F46E5,#06B6D4);border-radius:9px 9px 2px 9px;padding:8px;font-size:9.5px;color:#fff;max-width:80%;align-self:flex-end">${m}</div>`;const td=document.createElement('div');td.className='at';td.innerHTML='<div class="atd"></div><div class="atd"></div><div class="atd"></div>';b.appendChild(td);b.scrollTop=b.scrollHeight;const l=m.toLowerCase(),r=l.match(/fee|pay/)?AI_R.fee:l.match(/staff|teach/)?AI_R.staff:l.match(/bus|trans/)?AI_R.transport:l.match(/leave/)?AI_R.leave:l.match(/server|cpu/)?AI_R.server:l.match(/hostel|room|boarder/)?AI_R.hostel:l.match(/exam|test|result/)?AI_R.exam:AI_R.d;setTimeout(()=>{td.remove();b.innerHTML+=`<div style="background:#EEF2FF;border-radius:9px 9px 9px 2px;padding:8px;font-size:9.5px;line-height:1.4;color:#1E1B4B;max-width:85%">${r}</div>`;b.scrollTop=b.scrollHeight;},900);}
function aq(t){const q={fee:'Fee status?',staff:'Staff summary?',transport:'Fleet status?',leave:'Pending?',server:'Health?',hostel:'Hostel status?',exam:'Exam schedule?'};document.getElementById('ai').value=q[t]||'';as();}
</script>
