# Mosquitto MQTT Broker Configuration
# =====================================

# TCP listener on port 1883
listener 1883
protocol mqtt

# WebSocket listener on port 9001
listener 9001
protocol websockets

# Allow anonymous connections (set to false and add passwords for production)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type all
connection_messages true

# Max connections (0 = unlimited)
max_connections -1

# Max packet size (default 256MB)
# max_packet_size 0
